<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saturation Browser Demo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #eee; }
    main { width: min(680px, calc(100% - 32px)); padding: 32px; border: 1px solid #444; border-radius: 16px; background: #1a1a1a; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 38px); }
    p { color: #aaa; line-height: 1.6; }
    label { display: block; margin-top: 24px; font-weight: 700; }
    input[type="file"] { width: 100%; margin-top: 10px; }
    input[type="range"] { width: 100%; margin-top: 12px; accent-color: #e8a87c; }
    .buttons { display: flex; gap: 10px; margin-top: 28px; }
    button { flex: 1; min-height: 46px; border: 0; border-radius: 10px; background: #e8a87c; color: #111; font-weight: 800; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .35; }
    dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; margin: 24px 0 0; padding-top: 20px; border-top: 1px solid #333; }
    dt { color: #999; }
    dd { margin: 0; font-variant-numeric: tabular-nums; }
    #status { min-height: 24px; margin-top: 18px; color: #e8a87c; }
    @media (max-width: 520px) {
      main { padding: 22px; }
      .buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>실제 오디오에 Saturation 적용하기</h1>
    <p>파일은 서버로 전송하지 않고 브라우저 안에서만 처리합니다.</p>

    <label for="audio-file">오디오 파일</label>
    <input id="audio-file" type="file" accept="audio/*">

    <label for="drive">Drive <output id="drive-value">2.0</output></label>
    <input id="drive" type="range" min="1" max="5" step="0.1" value="2">

    <div class="buttons">
      <button id="play-original" disabled>원본 재생</button>
      <button id="process" disabled>새츄레이션 처리</button>
      <button id="play-processed" disabled>처리본 재생</button>
    </div>

    <dl>
      <dt>원본 RMS</dt><dd id="input-rms">-</dd>
      <dt>처리 후 RMS</dt><dd id="saturated-rms">-</dd>
      <dt>Output</dt><dd id="output-gain">-</dd>
      <dt>보정 후 RMS</dt><dd id="matched-rms">-</dd>
    </dl>

    <p id="status" role="status">오디오 파일을 선택해 주세요.</p>
  </main>

  <script>
    const fileInput = document.querySelector('#audio-file');
    const driveInput = document.querySelector('#drive');
    const driveValue = document.querySelector('#drive-value');
    const playOriginalButton = document.querySelector('#play-original');
    const processButton = document.querySelector('#process');
    const playProcessedButton = document.querySelector('#play-processed');
    const status = document.querySelector('#status');

    const audioContext = new AudioContext();
    let originalBuffer = null;
    let processedBuffer = null;
    let playingSource = null;
    let loadGeneration = 0;

    function stopPlayback() {
      if (!playingSource) return;

      playingSource.onended = null;
      try {
        playingSource.stop();
      } catch {
        // 이미 끝난 source는 다시 멈출 필요가 없다.
      }
      playingSource.disconnect();
      playingSource = null;
    }

    function resetAudioState() {
      stopPlayback();
      originalBuffer = null;
      processedBuffer = null;
      playOriginalButton.disabled = true;
      processButton.disabled = true;
      playProcessedButton.disabled = true;
      document.querySelector('#input-rms').textContent = '-';
      document.querySelector('#saturated-rms').textContent = '-';
      document.querySelector('#output-gain').textContent = '-';
      document.querySelector('#matched-rms').textContent = '-';
    }

    function getRmsFromBuffer(buffer) {
      let squareSum = 0;
      let sampleCount = 0;

      for (let channel = 0; channel < buffer.numberOfChannels; channel += 1) {
        const samples = buffer.getChannelData(channel);
        for (let i = 0; i < samples.length; i += 1) {
          squareSum += samples[i] * samples[i];
        }
        sampleCount += samples.length;
      }

      return sampleCount === 0 ? 0 : Math.sqrt(squareSum / sampleCount);
    }

    function createSaturatedBuffer(inputBuffer, drive) {
      const outputBuffer = audioContext.createBuffer(
        inputBuffer.numberOfChannels,
        inputBuffer.length,
        inputBuffer.sampleRate,
      );

      for (let channel = 0; channel < inputBuffer.numberOfChannels; channel += 1) {
        const input = inputBuffer.getChannelData(channel);
        const output = outputBuffer.getChannelData(channel);

        for (let i = 0; i < input.length; i += 1) {
          output[i] = Math.tanh(input[i] * drive);
        }
      }

      return outputBuffer;
    }

    function applyOutputGain(buffer, outputGain) {
      for (let channel = 0; channel < buffer.numberOfChannels; channel += 1) {
        const samples = buffer.getChannelData(channel);
        for (let i = 0; i < samples.length; i += 1) {
          samples[i] *= outputGain;
        }
      }
    }

    async function loadAudioFile(file) {
      const generation = ++loadGeneration;
      resetAudioState();
      status.textContent = '오디오 파일을 읽는 중입니다.';

      try {
        const fileData = await file.arrayBuffer();
        const decodedBuffer = await audioContext.decodeAudioData(fileData);
        if (generation !== loadGeneration) return;

        originalBuffer = decodedBuffer;
        playOriginalButton.disabled = false;
        processButton.disabled = false;
        playProcessedButton.disabled = true;
        status.textContent = `${file.name} 준비 완료`;
        document.querySelector('#input-rms').textContent = getRmsFromBuffer(originalBuffer).toFixed(6);
        document.querySelector('#saturated-rms').textContent = '-';
        document.querySelector('#output-gain').textContent = '-';
        document.querySelector('#matched-rms').textContent = '-';
      } catch (error) {
        if (generation !== loadGeneration) return;

        resetAudioState();
        status.textContent = '오디오 파일을 읽지 못했습니다.';
        console.error(error);
      }
    }

    async function playBuffer(buffer) {
      await audioContext.resume();
      stopPlayback();

      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      source.onended = () => {
        source.disconnect();
        if (playingSource === source) playingSource = null;
      };
      playingSource = source;
      source.start();
    }

    fileInput.addEventListener('change', async () => {
      const [file] = fileInput.files;
      if (!file) return;
      await loadAudioFile(file);
    });

    driveInput.addEventListener('input', () => {
      driveValue.value = Number(driveInput.value).toFixed(1);
      stopPlayback();
      if (processedBuffer) {
        processedBuffer = null;
        playProcessedButton.disabled = true;
        document.querySelector('#saturated-rms').textContent = '-';
        document.querySelector('#output-gain').textContent = '-';
        document.querySelector('#matched-rms').textContent = '-';
        status.textContent = 'Drive가 바뀌었습니다. 다시 처리해 주세요.';
      }
    });

    playOriginalButton.addEventListener('click', () => playBuffer(originalBuffer));

    processButton.addEventListener('click', () => {
      const drive = Number(driveInput.value);
      const inputRms = getRmsFromBuffer(originalBuffer);
      processedBuffer = createSaturatedBuffer(originalBuffer, drive);
      const saturatedRms = getRmsFromBuffer(processedBuffer);
      const outputGain = saturatedRms === 0 ? 1 : inputRms / saturatedRms;
      applyOutputGain(processedBuffer, outputGain);
      const matchedRms = getRmsFromBuffer(processedBuffer);

      document.querySelector('#input-rms').textContent = inputRms.toFixed(6);
      document.querySelector('#saturated-rms').textContent = saturatedRms.toFixed(6);
      document.querySelector('#output-gain').textContent = outputGain.toFixed(6);
      document.querySelector('#matched-rms').textContent = matchedRms.toFixed(6);
      playProcessedButton.disabled = false;
      status.textContent = '처리 완료. 원본과 처리본을 비교해 보세요.';
    });

    playProcessedButton.addEventListener('click', () => playBuffer(processedBuffer));

    window.saturationDemo = {
      getRmsFromBuffer,
      createSaturatedBuffer,
      applyOutputGain,
      loadAudioFile,
      stopPlayback,
      resetAudioState,
    };
  </script>
</body>
</html>
